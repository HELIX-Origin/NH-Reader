<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NH Reader project documentation">
  <title>{{ page.title | default: "Documentation" | escape }} | NH Reader</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <main class="layout documentation-layout">
    <aside class="sidebar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">NH</div>
        <div>
          <h1>NH Reader</h1>
          <p class="badge">Documentation</p>
        </div>
      </div>
      <div class="divider"></div>
      <a href="{{ '/' | relative_url }}">Project page</a>
      <a href="{{ '/README.html' | relative_url }}">Documentation home</a>
      <a href="https://github.com/HELIX-Origin/NH-Reader">Source on GitHub ↗</a>
    </aside>
    <div class="content">
      <nav aria-label="Documentation navigation">
        <a href="{{ '/' | relative_url }}">Project</a>
        <a href="{{ '/README.html' | relative_url }}">All docs</a>
        <a href="https://github.com/HELIX-Origin/NH-Reader/releases">Releases ↗</a>
      </nav>
      <article class="documentation-content">{{ content }}</article>
    </div>
  </main>
</body>
</html>
