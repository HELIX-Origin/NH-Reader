name: Cross-Platform Packaging

# Builds native installers and mobile packages across desktop and mobile targets.
# Packaged after the official Tauri v2 guide: https://v2.tauri.app/distribute/pipelines/github/
#
# Triggers:
#   • Version-tag push  — v*  (also attaches installers to the matching release)
#   • workflow_dispatch — manual build, creates downloadable workflow artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            artifact-name: windows-installers
            rust-targets: ''
            package-files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/*.zip
            build-command: |
              npm run build:app
              powershell -ExecutionPolicy Bypass -File scripts/sign.ps1 -BundleDir src-tauri/target/release/bundle
              powershell -ExecutionPolicy Bypass -Command "New-Item -ItemType Directory -Force -Path 'src-tauri/target/release/portable' | Out-Null; Copy-Item 'src-tauri/target/release/nh-reader.exe' -Destination 'src-tauri/target/release/portable/NH Reader.exe'; New-Item -ItemType File -Force -Path 'src-tauri/target/release/portable/.portable' | Out-Null; Compress-Archive -Path 'src-tauri/target/release/portable/*' -DestinationPath 'src-tauri/target/release/bundle/NHReaderPortable_Windows_x64.zip' -Force"

          - platform: ubuntu-22.04
            target: linux
            artifact-name: linux-packages
            rust-targets: ''
            package-files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/*.tar.gz
            build-command: |
              npm run build:app
              mkdir -p src-tauri/target/release/portable
              cp src-tauri/target/release/nh-reader src-tauri/target/release/portable/
              touch src-tauri/target/release/portable/.portable
              tar -czf src-tauri/target/release/bundle/nh-reader_portable_linux_x86_64.tar.gz -C src-tauri/target/release/portable .

          - platform: macos-latest
            target: macos
            artifact-name: macos-bundles
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            package-files: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/*.zip
            build-command: |
              npm run build:app
              for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
                codesign --force --sign - "$dmg" || true
              done
              APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -n 1)
              if [ -n "$APP_PATH" ]; then
                touch "$APP_PATH/.portable"
                zip -r src-tauri/target/release/bundle/NHReaderPortable_macOS.zip "$APP_PATH"
              fi

          - platform: ubuntu-22.04
            target: android
            artifact-name: android-apk
            rust-targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
            package-files: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            build-command: |
              if [ ! -d "src-tauri/gen/android" ]; then
                npm run mobile:android:init
              fi
              if [ ! -f "src-tauri/gen/android/release.keystore" ]; then
                keytool -genkey -v -keystore src-tauri/gen/android/release.keystore -alias nh-reader -keyalg RSA -keysize 2048 -validity 10000 -storepass nhreader -keypass nhreader -dname "CN=HELIX Origin, OU=NH Reader, O=HELIX Origin, L=Tokyo, ST=Tokyo, C=JP"
              fi
              cat <<EOF > src-tauri/gen/android/keystore.properties
              password=nhreader
              keyPassword=nhreader
              keyAlias=nh-reader
              storeFile=release.keystore
              EOF
              npm run mobile:android:build -- --ci
              APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
              if [ -n "$APKSIGNER" ]; then
                for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f); do
                  $APKSIGNER sign --ks src-tauri/gen/android/release.keystore --ks-pass pass:nhreader --key-pass pass:nhreader "$apk" || true
                done
              fi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Java JDK 17 (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK (Android)
        if: matrix.target == 'android'
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Sign Package
        run: ${{ matrix.build-command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.package-files }}
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'NH Reader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: ${{ matrix.package-files }}
          fail_on_unmatched_files: true