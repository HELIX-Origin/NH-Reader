name: Cross-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'True dry run (build and test without publishing a public release)'
        required: false
        type: boolean
        default: false
      create_test_release:
        description: 'Create temporary draft pre-release to test artifact publishing'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Manually publish assets to this existing release tag (e.g. v0.7.1). Overrides tag-push trigger. Leave empty for normal use.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            artifact-name: windows-installers
            rust-targets: ''
            package-files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/NHReaderPortable_Windows_x64.zip
            build-command: |
              npm run build:app
              powershell -ExecutionPolicy Bypass -File scripts/sign.ps1 -BundleDir src-tauri/target/release/bundle
              powershell -ExecutionPolicy Bypass -Command "New-Item -ItemType Directory -Force -Path 'src-tauri/target/release/portable/data' | Out-Null; Copy-Item 'src-tauri/target/release/nh-reader.exe' -Destination 'src-tauri/target/release/portable/NH Reader.exe'; Copy-Item 'scripts/launch-windows.bat' -Destination 'src-tauri/target/release/portable/launch-windows.bat'; New-Item -ItemType File -Force -Path 'src-tauri/target/release/portable/.portable' | Out-Null; Compress-Archive -Path 'src-tauri/target/release/portable/*' -DestinationPath 'src-tauri/target/release/bundle/NHReaderPortable_Windows_x64.zip' -Force"

          - platform: ubuntu-22.04
            target: linux
            artifact-name: linux-packages
            rust-targets: ''
            package-files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/nh-reader_portable_linux_x86_64.tar.gz
            build-command: |
              npm run build:app
              mkdir -p src-tauri/target/release/portable/data
              cp src-tauri/target/release/nh-reader src-tauri/target/release/portable/nh-reader-linux
              cp scripts/launch-linux.sh src-tauri/target/release/portable/launch-linux.sh
              chmod +x src-tauri/target/release/portable/nh-reader-linux src-tauri/target/release/portable/launch-linux.sh
              touch src-tauri/target/release/portable/.portable
              tar -czf src-tauri/target/release/bundle/nh-reader_portable_linux_x86_64.tar.gz -C src-tauri/target/release/portable .

          - platform: macos-latest
            target: macos
            artifact-name: macos-bundles
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            package-files: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/NHReaderPortable_macOS.zip
            build-command: |
              npm run build:app
              for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
                codesign --force --sign - "$dmg" || true
              done
              APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -n 1)
              if [ -n "$APP_PATH" ]; then
                mkdir -p src-tauri/target/release/portable-macos/data
                cp -R "$APP_PATH" "src-tauri/target/release/portable-macos/NH Reader.app"
                cp scripts/launch-macos.command "src-tauri/target/release/portable-macos/launch-macos.command"
                chmod +x "src-tauri/target/release/portable-macos/launch-macos.command"
                touch "src-tauri/target/release/portable-macos/.portable"
                zip -r src-tauri/target/release/bundle/NHReaderPortable_macOS.zip src-tauri/target/release/portable-macos
              fi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Sign Package
        run: ${{ matrix.build-command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.package-files }}
          if-no-files-found: error

  package-android:
    name: Package (Android APKs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "Using pre-installed Android NDK: $NDK_PATH"
          else
            echo "Installing NDK via sdkmanager..."
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Build Android split APKs
        run: |
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64 --ci
          mkdir -p src-tauri/target/release/bundle/android
          find src-tauri/gen/android -name "*.apk" -type f -exec cp {} src-tauri/target/release/bundle/android/ \;
          ls -la src-tauri/target/release/bundle/android

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src-tauri/target/release/bundle/android/*.apk
          if-no-files-found: error


  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, package-android]
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && inputs.dry_run != true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display release artifacts
        run: |
          echo "Release artifacts to publish:"
          ls -la release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          name: NH Reader ${{ env.EFFECTIVE_TAG }}
          draft: false
          prerelease: false
          files: release-artifacts/*
          fail_on_unmatched_files: true


  publish-test-prerelease:
    name: Publish Test Pre-Release (Dry Run)
    runs-on: ubuntu-latest
    needs: [package, package-android]
    if: inputs.create_test_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display release artifacts
        run: |
          echo "Test pre-release artifacts to publish:"
          ls -la release-artifacts

      - name: Publish Test Pre-Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: test-dryrun-${{ github.run_id }}
          name: 'NH Reader [Test Dry Run] (Run #${{ github.run_id }})'
          draft: true
          prerelease: true
          body: 'Temporary draft pre-release created for dry run packaging and upload verification.'
          files: release-artifacts/*
          fail_on_unmatched_files: true

  dry-run-summary:
    name: Dry Run Verification
    runs-on: ubuntu-latest
    needs: [package, package-android]
    if: (inputs.dry_run == true || !startsWith(github.ref, 'refs/tags/v')) && inputs.create_test_release != true
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: verified-artifacts
          merge-multiple: true

      - name: Validate built package artifacts
        run: |
          echo "========================================================"
          echo " NH Reader Packaging - TRUE DRY RUN VERIFICATION"
          echo "========================================================"
          echo "The packaging pipeline executed in TRUE DRY RUN mode."
          echo "No GitHub Release was created or modified."
          echo "No release artifacts were published to any release."
          echo ""
          echo "Verified Package Artifacts:"
          ls -la verified-artifacts
          echo ""
          echo "Total package files generated: $(find verified-artifacts -type f | wc -l)"
          echo "========================================================"