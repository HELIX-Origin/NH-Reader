name: Cross-Platform Packaging

# Builds native installers and mobile packages across desktop and mobile targets.
# Packaged after the official Tauri v2 guide: https://v2.tauri.app/distribute/pipelines/github/
#
# Triggers:
#   • Version-tag push  — v*  (also attaches installers to the matching release)
#   • workflow_dispatch — manual build, creates downloadable workflow artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Package Desktop (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installers
            package-files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: ubuntu-22.04
            artifact-name: linux-packages
            package-files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: macos-latest
            artifact-name: macos-bundles
            package-files: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Desktop Application and Bundles
        run: npm run build:app

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.package-files }}
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'NH Reader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: ${{ matrix.package-files }}
          fail_on_unmatched_files: true

  android:
    name: Package Mobile (android-apk)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          export NDK_HOME=$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk 2>/dev/null | tail -n 1)
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run mobile:android:init
          fi
          npm run mobile:android:build -- --ci

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'NH Reader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true

  ios:
    name: Package Mobile (ios-bundles)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build iOS Application Bundle
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run mobile:ios:init
          fi
          npm run mobile:ios:build -- --export-method development CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          if ! ls src-tauri/gen/apple/build/**/*.ipa 1> /dev/null 2>&1; then
            APP_DIR=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
            if [ -n "$APP_DIR" ]; then
              mkdir -p Payload
              cp -R "$APP_DIR" Payload/
              mkdir -p src-tauri/gen/apple/build
              zip -r src-tauri/gen/apple/build/nh-reader.ipa Payload
              rm -rf Payload
            fi
          fi

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundles
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error

      - name: Attach iOS Package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'NH Reader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: src-tauri/gen/apple/build/**/*.ipa
          fail_on_unmatched_files: true