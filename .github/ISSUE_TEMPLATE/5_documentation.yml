name: "📖 Documentation Improvement"
description: "Suggest improvements, report errors, or propose new guides for repo documentation in docs/"
title: "📖 [Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Accurate, high-quality documentation is a priority for NH Reader.
        Before filing, please review our [Documentation](https://github.com/HELIX-Origin/NH-Reader/tree/main/docs).
  - type: dropdown
    id: doc_target
    attributes:
      label: "Documentation Location"
      description: "Where is the documentation located?"
      options:
        - "docs/ - Getting Started & Installation"
        - "docs/ - Search & Filters Guide"
        - "docs/ - Blacklist Guide"
        - "docs/ - Reader Guide"
        - "docs/ - Architecture & Internal Design"
        - "docs/ - Downloads / Background Service"
        - "docs/ - Troubleshooting & FAQ"
        - "Repository README.md"
        - "Agent ecosystem (.agents/ rules, agents, skills, templates)"
        - "Other / New Page Proposal"
    validations:
      required: true
  - type: textarea
    id: issue_description
    attributes:
      label: "Description of the Issue or Enhancement"
      description: "What is inaccurate, outdated, missing, or unclear?"
      placeholder: "The documentation for... states that... but actually..."
    validations:
      required: true
  - type: textarea
    id: suggested_content
    attributes:
      label: "Suggested Correction or Proposed Content"
      description: "Provide the updated text, code snippets, or markdown you would like to see."
      placeholder: "Replace section... with..."
    validations:
      required: false
  - type: checkboxes
    id: guidelines
    attributes:
      label: "Style & Guidelines Checklist"
      options:
        - label: "I verified that documentation links use explicit `.md` extensions and valid relative paths."
          required: false
        - label: "I verified that links to documentation from the repo root use `docs/{page}.md` paths."
          required: false
        - label: "I verified emoji + mermaid legibility per the docs-format rule if I included a diagram."
          required: false